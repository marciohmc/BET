version: '3.8'

# ==============================================================================
# Cassanova iGaming Platform - Core Docker Compose Stack
# ==============================================================================
# This stack spins up:
# 1. MongoDB (Database) - The Cassanova backend strictly uses Mongoose (NoSQL).
# 2. Cassanova Backend (Express API on Port 5000)
# 3. Cassanova Frontend (Next.js SPA on Port 3000)
# ==============================================================================

services:
  # DB Service (MongoDB - strictly used by the Cassanova schema)
  database:
    image: mongo:6.0-jammy
    container_name: cassanova-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - cassanova-db-vol:/data/db
    networks:
      - cassanova-net

  # Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      # Target development for nodemon-based hot-reloading:
      # target: development
    container_name: cassanova-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://database:27017/cassanova
      - JWT_SECRET=your-secret-key-change-in-production-safely-1234
      - FRONTEND_URL=http://localhost:3000
      - NODE_ENV=development
    depends_on:
      - database
    networks:
      - cassanova-net

  # Frontend Next.js Client Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cassanova-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      # Exposed client-side to point Next.js browser page requests to backend API
      - NEXT_PUBLIC_API_URL=http://localhost:5000/api
    depends_on:
      - backend
    networks:
      - cassanova-net

# Persistent volumes for database storage
volumes:
  cassanova-db-vol:
    driver: local

# Isolated network bridge for microservice communication 
networks:
  cassanova-net:
    driver: bridge
